name: CupCat bot clone checks

on:
  push:
    branches:
      - cursor/cupcat-bot-clone
  pull_request:
    branches:
      - cursor/cupcat-bot-clone

jobs:
  profile-and-syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only profile test dependencies
        run: python -m pip install pytest PyYAML==6.0.2
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Test bot profile, memory and edit-plan regressions
        run: python -m pytest -q tests/test_bot_profile.py tests/test_creative.py
      - name: Validate Colab notebook JSON and Python cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebook_path = Path("../colab/CupCat_Bot_Clone_Colab.ipynb")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") == "code":
                  compile("".join(cell.get("source", [])), f"{notebook_path}:cell-{index}", "exec")
          print(f"Notebook valid: {len(notebook.get('cells', []))} cells; all code cells compile.")
          PY
