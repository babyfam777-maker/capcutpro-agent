services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  ollama-setup:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "qwen2.5:3b"]
    restart: "no"

  worker:
    build: ./worker
    ports:
      - "8787:8787"
    environment:
      OPENAI_BASE_URL: http://ollama:11434/v1
      OPENAI_API_KEY: ollama
      MODEL: qwen2.5:3b
      DATA_DIR: /data
      WHISPER_MODEL: base
    volumes:
      - ./data:/data
    depends_on:
      - ollama

  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - web_modules:/app/node_modules
    environment:
      WORKER_URL: http://worker:8787
    ports:
      - "3000:3000"
    command: bash -lc "corepack enable && corepack prepare pnpm@10.18.0 --activate && pnpm install --frozen-lockfile && CAPCUT_SKIP_EVE=1 pnpm dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - worker

volumes:
  ollama:
  web_modules:
